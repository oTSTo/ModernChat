<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liquid Chat Sticky Menu</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #007AFF;
            --primary-grad: linear-gradient(135deg, #007AFF, #00C6FF);
            --bg-glass: rgba(255, 255, 255, 0.75);
            --border-glass: rgba(255, 255, 255, 0.4);
            --text-dark: #111;
            --text-grey: #8e8e93;
            --red: #FF3B30;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body {
            background: #dfe6e9; height: 100vh; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .liquid-bg { position: absolute; width: 100%; height: 100%; z-index: -1; overflow: hidden; background: #f4f7f6; }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; animation: float 25s infinite alternate; }
        .orb:nth-child(1) { top: -10%; left: -10%; width: 60vw; height: 60vw; background: #a8edea; }
        .orb:nth-child(2) { bottom: -20%; right: -10%; width: 50vw; height: 50vw; background: #fed6e3; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0,0); } 100% { transform: translate(30px, -30px); } }

        .app-container {
            width: 95vw; height: 92vh; max-width: 1200px;
            background: var(--bg-glass); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-glass); border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1); display: flex; overflow: hidden; position: relative;
        }

        .sidebar { width: 320px; border-right: 1px solid rgba(0,0,0,0.06); display: flex; flex-direction: column; background: rgba(255,255,255,0.3); }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(0,0,0,0.06); }
        
        .my-id-box {
            background: rgba(255,255,255,0.6); padding: 15px; border-radius: 16px; margin-top: 10px;
        }
        .id-val { font-family: monospace; font-size: 13px; color: var(--text-dark); word-break: break-all; cursor: pointer; user-select: all; }
        
        .contact-list { flex: 1; overflow-y: auto; padding: 10px; }
        .contact-item {
            display: flex; align-items: center; padding: 12px; border-radius: 14px; margin-bottom: 4px; cursor: pointer; transition: 0.2s;
        }
        .contact-item:hover { background: rgba(255,255,255,0.5); }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-grad); color: white; display: flex; align-items: center; justify-content: center; margin-right: 12px; font-weight: bold; }

        .chat-main { flex: 1; display: flex; flex-direction: column; background: rgba(255,255,255,0.2); position: relative; }
        .chat-top { height: 70px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.5); }
        .messages-wrap { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; position: relative; }
        
        .msg-bubble {
            max-width: 70%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4;
            position: relative; animation: slideUp 0.3s ease; display: flex; flex-direction: column;
            transition: transform 0.2s; cursor: pointer;
        }
        .msg-bubble:active { transform: scale(0.97); }
        /* Quando tengo premuto, si "accartoccia" un po' */
        .msg-bubble.holding { transform: scale(0.95); filter: brightness(0.9); }

        .msg-bubble.me { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .msg-bubble.them { align-self: flex-start; background: #fff; color: var(--text-dark); border-bottom-left-radius: 4px; }
        
        .msg-meta { font-size: 10px; margin-top: 4px; opacity: 0.7; text-align: right; }

        .chat-input-area { padding: 20px; background: rgba(255,255,255,0.6); display: flex; gap: 10px; align-items: center; }
        .input-std { width: 100%; padding: 10px; border-radius: 12px; border: none; background: rgba(255,255,255,0.8); outline: none; user-select: text; }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--primary); color: white; border: none; cursor: pointer; }

        /* --- LIQUID GLASS MENU STICKY --- */
        .glass-menu {
            position: fixed; /* Fixed per non essere tagliato */
            z-index: 9999;
            display: none;
            padding: 10px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-direction: row;
            gap: 10px;
        }

        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        .menu-btn {
            background: transparent; border: none; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #333; font-size: 11px; font-weight: 600;
            padding: 8px 15px; border-radius: 10px; transition: 0.1s;
        }
        .menu-btn:hover { background: rgba(0,0,0,0.05); }
        .menu-btn svg { width: 22px; height: 22px; margin-bottom: 4px; stroke-width: 2; }
        .btn-del { color: #FF3B30; }
        .btn-edit { color: #007AFF; }

        /* PARTICELLE */
        .particle { position: fixed; background: var(--primary); width: 5px; height: 5px; border-radius: 50%; pointer-events: none; z-index: 10000; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Overlay invisibile per chiudere menu cliccando fuori */
        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9998;
            display: none; cursor: default;
        }

        @media(max-width: 768px) {
            .sidebar { position: absolute; width: 100%; height: 100%; z-index: 10; transform: translateX(0); transition: 0.3s; }
            .sidebar.hide { transform: translateX(-100%); }
            .back-btn { display: block; font-size: 20px; margin-right: 15px; cursor: pointer; }
        }
        .back-btn { display: none; }
    </style>
</head>
<body>

    <div class="liquid-bg"><div class="orb"></div><div class="orb"></div></div>

    <div id="menu-overlay" onclick="closeMenu()"></div>

    <div id="liquid-menu" class="glass-menu">
        <button class="menu-btn btn-edit" onclick="triggerEdit()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            Modifica
        </button>
        <div style="width: 1px; height: 30px; background: rgba(0,0,0,0.1);"></div>
        <button class="menu-btn btn-del" onclick="triggerDelete()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            Elimina
        </button>
    </div>

    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>Chat Ultimate</h3>
                <div class="my-id-box">
                    <div class="id-val" id="my-id" onclick="copyId()">ID...</div>
                    <div style="margin-top:5px; display:flex; gap:5px;">
                        <button onclick="copyId()" style="flex:1; border:none; padding:5px; border-radius:5px;">Copia</button>
                        <button onclick="regenId()" style="flex:1; border:none; padding:5px; border-radius:5px; color:red; background:rgba(255,0,0,0.1);">Rigenera</button>
                    </div>
                </div>
            </div>
            <div style="padding:10px; display:flex;">
                <input id="add-id" class="input-std" placeholder="Nuovo ID...">
                <button onclick="addContact()" class="send-btn" style="width:35px; height:35px; margin-left:5px;">+</button>
            </div>
            <div class="contact-list" id="contact-list"></div>
        </div>

        <div class="chat-main">
            <div class="chat-top">
                <div style="display:flex; align-items:center;">
                    <div class="back-btn" onclick="toggleSidebar()">←</div>
                    <div><b id="chat-name">Chat</b> <span id="chat-status" style="font-size:12px; color:#888;"></span></div>
                </div>
            </div>

            <div class="messages-wrap" id="msg-container">
                <div style="text-align:center; margin-top:50px; color:#999; font-size:12px;">
                    Tieni premuto 1 secondo su un messaggio per opzioni.
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" class="input-std" id="msg-input" placeholder="Scrivi..." onkeypress="checkEnter(event)" disabled>
                <button class="send-btn" onclick="sendText()" id="btn-send" disabled>➤</button>
            </div>
        </div>
    </div>

<script>
    const APP = "liquid_v3_";
    let myId = localStorage.getItem(APP+'id');
    let contacts = JSON.parse(localStorage.getItem(APP+'contacts')) || {};
    let peer, conn, activeChat = null;
    let selectedMsgId = null;
    let pressTimer;

    // INIT
    if(!myId) { myId = Math.random().toString(36).substr(2, 6); localStorage.setItem(APP+'id', myId); }
    document.getElementById('my-id').innerText = myId;
    renderContacts();
    initPeer();

    function initPeer() {
        peer = new Peer(myId);
        peer.on('connection', c => handleConn(c));
    }

    function handleConn(c) {
        c.on('open', () => {
            if(!contacts[c.peer]) { contacts[c.peer] = { nick: "Utente", msgs: [] }; save(); renderContacts(); }
            if(activeChat === c.peer) { conn = c; updateStatus("Online"); enableInput(true); }
        });
        c.on('data', d => handleData(d, c.peer));
        c.on('close', () => { if(activeChat === c.peer) { conn = null; updateStatus("Offline"); enableInput(false); } });
    }

    function handleData(data, peerId) {
        if(data.type === 'msg') {
            contacts[peerId].msgs.push({ id: data.id, text: data.text, from: 'them' });
            if(activeChat === peerId) renderMsg(contacts[peerId].msgs[contacts[peerId].msgs.length-1]);
        }
        else if(data.type === 'delete') { deleteLocalMsg(peerId, data.id); }
        else if(data.type === 'edit') { editLocalMsg(peerId, data.id, data.text); }
        save();
    }

    function sendText() {
        const txt = document.getElementById('msg-input').value.trim();
        if(!txt || !activeChat) return;
        const id = Date.now().toString(36);
        const msg = { id, text: txt, from: 'me' };
        contacts[activeChat].msgs.push(msg);
        renderMsg(msg);
        save();
        if(conn && conn.open) conn.send({type:'msg', id, text:txt});
        document.getElementById('msg-input').value = '';
    }

    function renderMsg(msg) {
        const div = document.createElement('div');
        div.className = `msg-bubble ${msg.from}`;
        div.id = `msg-${msg.id}`;
        div.innerHTML = `<span class="txt">${msg.text}</span><div class="msg-meta">${msg.from}</div>`;
        
        // --- LOGICA STICKY MENU AGGIORNATA ---
        if(msg.from === 'me') {
            // Mouse
            div.onmousedown = (e) => startPress(e, msg.id, div);
            div.onmouseup = div.onmouseleave = () => cancelPress(div);
            
            // Touch
            div.ontouchstart = (e) => startPress(e.touches[0], msg.id, div);
            div.ontouchend = div.ontouchcancel = () => cancelPress(div);
            
            // Disabilita menu contestuale nativo (importante per mobile)
            div.oncontextmenu = (e) => { e.preventDefault(); return false; };
        }

        document.getElementById('msg-container').appendChild(div);
        document.getElementById('msg-container').scrollTop = 99999;
    }

    function startPress(e, id, el) {
        // Se il menu è già aperto, non fare nulla (o chiudilo prima)
        if(document.getElementById('liquid-menu').style.display === 'flex') return;

        el.classList.add('holding');
        pressTimer = setTimeout(() => {
            el.classList.remove('holding'); // Rilascia l'effetto visivo
            showStickyMenu(e, id, el);
        }, 1000); // 1 secondo esatto
    }

    function cancelPress(el) {
        el.classList.remove('holding');
        clearTimeout(pressTimer);
    }

    function showStickyMenu(e, msgId, element) {
        if(navigator.vibrate) navigator.vibrate(50);
        selectedMsgId = msgId;

        const menu = document.getElementById('liquid-menu');
        const overlay = document.getElementById('menu-overlay');
        const rect = element.getBoundingClientRect();

        // Calcolo posizione (sopra la bolla)
        let top = rect.top - 60;
        let left = rect.left + (rect.width / 2) - 80;

        // Limiti schermo
        if(top < 10) top = rect.bottom + 10;
        if(left < 10) left = 10;
        if(left + 160 > window.innerWidth) left = window.innerWidth - 170;

        menu.style.top = top + 'px';
        menu.style.left = left + 'px';
        menu.style.display = 'flex';
        overlay.style.display = 'block'; // Attiva overlay invisibile
    }

    function closeMenu() {
        document.getElementById('liquid-menu').style.display = 'none';
        document.getElementById('menu-overlay').style.display = 'none';
        selectedMsgId = null;
    }

    function triggerDelete() {
        if(!selectedMsgId || !activeChat) return;
        if(conn) conn.send({type:'delete', id: selectedMsgId});
        deleteLocalMsg(activeChat, selectedMsgId);
        closeMenu();
    }

    function triggerEdit() {
        if(!selectedMsgId) return;
        const msg = contacts[activeChat].msgs.find(m => m.id === selectedMsgId);
        const newTxt = prompt("Modifica:", msg.text);
        if(newTxt) {
            msg.text = newTxt;
            save();
            document.querySelector(`#msg-${selectedMsgId} .txt`).innerText = newTxt;
            if(conn) conn.send({type:'edit', id:selectedMsgId, text:newTxt});
        }
        closeMenu();
    }

    function deleteLocalMsg(peerId, msgId) {
        const arr = contacts[peerId].msgs;
        const idx = arr.findIndex(m => m.id === msgId);
        if(idx !== -1) arr.splice(idx, 1);
        save();
        
        if(activeChat === peerId) {
            const el = document.getElementById(`msg-${msgId}`);
            if(el) {
                // Particelle
                const rect = el.getBoundingClientRect();
                for(let i=0; i<15; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    document.body.appendChild(p);
                    p.style.left = (rect.left + Math.random()*rect.width) + 'px';
                    p.style.top = (rect.top + Math.random()*rect.height) + 'px';
                    p.animate([{transform:'scale(1)', opacity:1}, {transform:`translate(${(Math.random()-0.5)*100}px, -60px) scale(0)`, opacity:0}], 600).onfinish=()=>p.remove();
                }
                el.style.opacity = 0;
                setTimeout(()=>el.remove(), 500);
            }
        }
    }

    // UTILS
    function openChat(id) {
        activeChat = id;
        document.getElementById('sidebar').classList.add('hide');
        document.getElementById('chat-name').innerText = contacts[id].nick;
        document.getElementById('msg-container').innerHTML = '';
        contacts[id].msgs.forEach(renderMsg);
        if(conn) conn.close();
        conn = peer.connect(id);
        handleConn(conn);
    }
    
    function addContact() {
        const id = document.getElementById('add-id').value;
        if(id && !contacts[id]) { contacts[id]={nick:"Amico", msgs:[]}; save(); renderContacts(); }
    }
    function renderContacts() {
        const l = document.getElementById('contact-list'); l.innerHTML = '';
        Object.keys(contacts).forEach(k => {
            const d = document.createElement('div'); d.className = 'contact-item';
            d.innerHTML = `<div class="avatar">${contacts[k].nick[0]}</div><div>${contacts[k].nick}</div>`;
            d.onclick = () => openChat(k);
            l.appendChild(d);
        });
    }

    function save() { localStorage.setItem(APP+'contacts', JSON.stringify(contacts)); }
    function copyId() { navigator.clipboard.writeText(myId); alert("Copiato!"); }
    function regenId() { localStorage.clear(); location.reload(); }
    function checkEnter(e) { if(e.key==='Enter') sendText(); }
    function updateStatus(s) { document.getElementById('chat-status').innerText = s; }
    function enableInput(b) { document.getElementById('msg-input').disabled = !b; document.getElementById('btn-send').disabled = !b; }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('hide'); }

</script>
</body>
</html>
