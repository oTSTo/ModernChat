<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iChat P2P</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root {
            --app-bg: #eef2f5;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --primary: #007AFF;
            --incoming-bubble: #ffffff;
            --outgoing-bubble: #007AFF;
            --text-dark: #1d1d1f;
            --text-light: #86868b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--app-bg);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ANIMAZIONI LIQUID --- */
        .liquid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: move 20s infinite alternate;
        }

        .blob:nth-child(1) {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: #a8c0ff;
            animation-duration: 25s;
        }

        .blob:nth-child(2) {
            bottom: -10%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: #3f2b96;
            animation-duration: 30s;
            animation-direction: reverse;
        }

        .blob:nth-child(3) {
            top: 40%;
            left: 40%;
            width: 30vw;
            height: 30vw;
            background: #007AFF;
            animation-duration: 20s;
        }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(50px, -50px) scale(1.1); }
        }

        /* --- APP CONTAINER --- */
        .app-container {
            width: 90vw;
            height: 90vh;
            max-width: 1200px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 300px;
            border-right: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.3);
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #007AFF, #00c6ff);
            border-radius: 50%;
        }

        .connection-panel {
            padding: 20px;
            background: rgba(255,255,255,0.4);
            margin: 10px;
            border-radius: 12px;
        }

        .connection-panel h3 {
            font-size: 14px;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .id-display {
            font-size: 12px;
            color: var(--text-light);
            background: rgba(0,0,0,0.05);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            word-break: break-all;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .id-display:hover { background: rgba(0,0,0,0.1); }

        .connect-input {
            width: 100%;
            padding: 8px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            outline: none;
        }

        .connect-btn {
            width: 100%;
            padding: 8px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .connect-btn:hover { background: #0066cc; }

        /* --- CHAT AREA --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.1);
            position: relative;
        }

        .chat-header {
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            background: rgba(255,255,255,0.4);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #ccc;
            border-radius: 50%;
            margin-right: 10px;
            transition: 0.3s;
        }
        .status-dot.online { background: #34C759; box-shadow: 0 0 10px #34C759; }

        .chat-title { font-weight: 600; color: var(--text-dark); }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* --- MESSAGES STYLES --- */
        .message {
            max-width: 70%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(10px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.sent {
            align-self: flex-end;
            background: var(--outgoing-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: var(--incoming-bubble);
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .input-area {
            padding: 20px;
            background: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .msg-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.1);
            outline: none;
            background: white;
            font-size: 15px;
            transition: 0.2s;
        }

        .msg-input:focus { box-shadow: 0 0 0 2px rgba(0,122,255,0.3); }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .send-btn:hover { transform: scale(1.1); }
        .send-btn:active { transform: scale(0.9); }

        /* Responsive */
        @media (max-width: 700px) {
            .app-container { width: 100vw; height: 100vh; border-radius: 0; }
            .sidebar { display: none; position: absolute; z-index: 100; height: 100%; width: 80%; background: white; box-shadow: 10px 0 20px rgba(0,0,0,0.1); }
            .sidebar.active { display: flex; }
            .menu-toggle { display: block; margin-right: 10px; cursor: pointer; }
        }
        @media (min-width: 701px) { .menu-toggle { display: none; } }

    </style>
</head>
<body>

    <div class="liquid-bg">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="user-avatar"></div>
                <h2 style="font-size: 18px; font-weight: 600;">Chat</h2>
            </div>
            
            <div class="connection-panel">
                <h3>Il Tuo ID</h3>
                <div class="id-display" id="my-id" onclick="copyId()">Caricamento...</div>
                
                <h3>Collega Amico</h3>
                <input type="text" id="friend-id-input" class="connect-input" placeholder="Incolla ID amico qui...">
                <button class="connect-btn" onclick="connectToPeer()">Connetti</button>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div class="menu-toggle" onclick="toggleSidebar()">☰</div>
                <div class="status-dot" id="status-dot"></div>
                <div class="chat-title" id="chat-title">In attesa di connessione...</div>
            </div>

            <div class="messages-container" id="messages">
                <div style="text-align: center; color: #888; font-size: 13px; margin-top: 20px;">
                    Usa la sidebar per connetterti a un amico. <br>La chat è crittografata P2P.
                </div>
            </div>

            <div class="input-area">
                <input type="text" class="msg-input" id="msg-input" placeholder="Scrivi un messaggio..." onkeypress="handleEnter(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- LOGICA P2P & UI ---
        
        let peer;
        let conn;
        const myIdEl = document.getElementById('my-id');
        const statusDot = document.getElementById('status-dot');
        const chatTitle = document.getElementById('chat-title');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msg-input');

        // Inizializza PeerJS
        function initPeer() {
            peer = new Peer(); // Genera un ID casuale collegandosi al server pubblico di PeerJS

            peer.on('open', (id) => {
                myIdEl.innerText = id;
                console.log('Il mio ID è: ' + id);
            });

            // Quando qualcuno si connette a me
            peer.on('connection', (connection) => {
                handleConnection(connection);
            });

            peer.on('error', (err) => {
                alert("Errore P2P: " + err.type);
            });
        }

        // Connettiti a un amico
        function connectToPeer() {
            const friendId = document.getElementById('friend-id-input').value.trim();
            if (!friendId) return alert("Inserisci un ID valido!");
            
            const connection = peer.connect(friendId);
            handleConnection(connection);
        }

        // Gestione connessione
        function handleConnection(connection) {
            conn = connection;
            
            conn.on('open', () => {
                statusDot.classList.add('online');
                chatTitle.innerText = "Connesso con " + conn.peer;
                messagesDiv.innerHTML = ''; // Pulisce messaggi di benvenuto
                addSystemMessage("Connessione stabilita in sicurezza.");
            });

            conn.on('data', (data) => {
                addMessage(data, 'received');
            });

            conn.on('close', () => {
                statusDot.classList.remove('online');
                chatTitle.innerText = "Disconnesso";
                addSystemMessage("L'utente si è disconnesso.");
                conn = null;
            });
        }

        // Invia messaggio
        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            if (conn && conn.open) {
                conn.send(text);
                addMessage(text, 'sent');
                msgInput.value = '';
            } else {
                alert("Non sei connesso a nessuno!");
            }
        }

        // UI Helpers
        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerText = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.color = '#86868b';
            div.style.fontSize = '12px';
            div.style.margin = '10px 0';
            div.innerText = text;
            messagesDiv.appendChild(div);
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function copyId() {
            navigator.clipboard.writeText(myIdEl.innerText).then(() => {
                alert("ID copiato negli appunti!");
            });
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // Avvio
        initPeer();

    </script>
</body>
</html>
